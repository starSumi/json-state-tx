name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.89.0
          components: clippy,rustfmt
      - name: Verify tag and source
        shell: pwsh
        run: |
          $cargoVersion = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -cne "v$cargoVersion") { throw "Tag does not match Cargo version" }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag commit is not on main" }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  build:
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: json-state-tx.exe
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: json-state-tx
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          $stage = Join-Path $PWD "stage"
          New-Item -ItemType Directory -Path (Join-Path $stage "skills") -Force | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BINARY" $stage
          Copy-Item README.md,LICENSE-MIT,CHANGELOG.md $stage
          Copy-Item skills/json-state-tx (Join-Path $stage "skills/json-state-tx") -Recurse
          [ordered]@{
            version = $env:GITHUB_REF_NAME.TrimStart('v')
            git_sha = $env:GITHUB_SHA
            target = $env:TARGET
            rustc = (rustc --version)
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $stage "build-info.json")
          $base = "json-state-tx-$env:GITHUB_REF_NAME-$env:TARGET"
          if ($env:ARCHIVE_KIND -eq "zip") {
            Compress-Archive -Path "$stage/*" -DestinationPath "$base.zip"
          } else {
            tar -C $stage -czf "$base.tar.gz" .
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: json-state-tx-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: dist/json-state-tx-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        working-directory: dist
        run: sha256sum json-state-tx-* > SHA256SUMS
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
